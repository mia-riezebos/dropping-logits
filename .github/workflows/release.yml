# Keeps a "chore: version packages" pull request open while changesets wait on main. Once main has no pending
# changesets and its version has no release yet, this tags vX.Y.Z and publishes a GitHub release with the extension
# zip, the source zip addons.mozilla.org asks for, and their SHA-256 checksums.
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile

      - id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version-script: pnpm changeset version
          commit-message: "chore: version packages"
          pr-title: "chore: version packages"

      - name: Find an unreleased version
        id: version
        if: steps.changesets.outputs['has-changesets'] == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(node -p 'require("./package.json").version')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" > /dev/null 2>&1; then
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Package the extension and its source
        if: steps.version.outputs.new == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          pnpm check
          pnpm test
          pnpm build
          pnpm lint:ext
          pnpm package
          git archive --format=zip --output="artifacts/dropping-logs-$VERSION-source.zip" HEAD
          cd artifacts && sha256sum ./*.zip > SHA256SUMS

      - name: Publish the release
        if: steps.version.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          notes="$(awk -v heading="## $VERSION" '$0 == heading { found = 1; next } /^## / { found = 0 } found' CHANGELOG.md 2> /dev/null || true)"
          if [ -n "$notes" ]; then
            set -- --notes "$notes"
          else
            set -- --generate-notes
          fi
          gh release create "v$VERSION" --target "$GITHUB_SHA" --title "v$VERSION" "$@" artifacts/*.zip artifacts/SHA256SUMS
